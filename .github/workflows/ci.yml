name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Data contract checks
        run: node scripts/check-data.mjs
      - name: Assistant tests (offline, no API key)
        run: node scripts/test-ask.mjs dist/data/ai-corpus.json
      - name: Theme contrast check
        run: node scripts/check-theme.mjs
